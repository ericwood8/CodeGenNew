name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # No database is available here: the live schema tests report themselves as inconclusive when
      # their CODEGENNEW_* environment variables are not set.
      - name: Test
        run: dotnet test CodeGenNew.Tests -c Release --logger "trx;LogFileName=tests.trx"
      - name: Pack the command-line tool
        run: dotnet pack CodeGenNew.Cli -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: codegen-tool
          path: artifacts/*.nupkg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: "**/tests.trx"

  # The generator and the command-line tool are plain net10.0; this job shows they build and pass their tests on Linux and macOS
  # (case-sensitive paths on Linux, / separators, LF line endings, /bin/sh instead of cmd.exe, Apple silicon on macOS).
  # The WinUI3 desktop app is Windows only.
  unix-build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test CodeGenNew.Tests -c Release --logger "trx;LogFileName=tests.trx"
      - name: Run the command-line tool
        run: dotnet run --project CodeGenNew.Cli -c Release -- --help
      - name: Pack the command-line tool
        run: dotnet pack CodeGenNew.Cli -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/tests.trx"

  desktop-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the WinUI3 app
        run: dotnet build CodeGenNew.App -c Release -p:Platform=x64

  # The generated front ends in a real browser: Docs/Verification/Test-FrontEndPages.py generates a throwaway SQLite project, builds and starts the API and
  # the front end, and walks the Region screen, a drop-down fed by another table, a master-detail dialog and the paging bar, checking the database after each step.
  # It uses the Chrome that the runner already has, so no browser is downloaded.
  browser-walk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [react, angular, blazor]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install playwright
      - name: Walk the ${{ matrix.stack }} app
        run: python Docs/Verification/Test-FrontEndPages.py --stack ${{ matrix.stack }} --build-cli

  # The Uno browser head needs the wasm-tools workload and draws on a canvas, so it is driven through its accessibility page.
  browser-walk-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: dotnet workload install wasm-tools
      - run: pip install playwright
      - name: Walk the Uno app
        run: python Docs/Verification/Test-FrontEndPages.py --stack uno --build-cli

  # The live schema tests (what the databases report about tables, keys, checks, comments and indexes) over throwaway servers: GitHub service containers for
  # PostgreSQL, MySQL and SQL Server. The databases are empty, so the tests that read the InvoiceSystem sample's tables report themselves as inconclusive
  # (CODEGENNEW_SAMPLE_DATA=none); the others make their own tables and drop them again.
  live-schema-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: codegen
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci" --health-interval 5s --health-timeout 5s --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Passw0rd-1"
        ports: ["1433:1433"]
    env:
      CODEGENNEW_SAMPLE_DATA: none
      CODEGENNEW_PG_HOST: localhost
      CODEGENNEW_PG_DATABASE: postgres
      CODEGENNEW_PG_USER: postgres
      CODEGENNEW_PG_PASSWORD: ci
      CODEGENNEW_MYSQL_HOST: 127.0.0.1
      CODEGENNEW_MYSQL_DATABASE: codegen
      CODEGENNEW_MYSQL_USER: root
      CODEGENNEW_MYSQL_PASSWORD: ci
      CODEGENNEW_SQLSERVER_HOST: localhost
      CODEGENNEW_SQLSERVER_DATABASE: master
      CODEGENNEW_SQLSERVER_USER: sa
      CODEGENNEW_SQLSERVER_PASSWORD: "Ci-Passw0rd-1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # SQL Server takes the longest to accept a login
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/localhost/1433) 2>/dev/null && break
            sleep 2
          done
          sleep 15
      - name: Live schema tests
        run: dotnet test CodeGenNew.Tests -c Release --filter "FullyQualifiedName~PostgresIntegrationTests|FullyQualifiedName~MySqlTests|FullyQualifiedName~SchemaDescriptionTests|FullyQualifiedName~SchemaIndexTests|FullyQualifiedName~CheckConstraintTests"
